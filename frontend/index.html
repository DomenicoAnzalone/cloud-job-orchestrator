<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CJO Demo UI</title>
</head>
<link rel="stylesheet" href="css/style.css"/>
<script src="js/auth.js" defer></script>
<script src="js/app.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
<body>

  <div id="authOverlay" style="
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.6);
    z-index: 9999;
  ">

    <div class="card" style="width: 360px; text-align: center;">
      <h3>Authentication required</h3>
      <p class="muted">
        You must log in with Microsoft to access the application.
      </p>

      <div class="actions" style="justify-content: center;">
        <button id="loginBtn">Login with Microsoft</button>
      </div>

      <p id="loginStatus" class="muted" style="margin-top: 12px;"></p>
    </div>

  </div>

  <div id="app" class="container">
    <div class="card">
      <h1>Cloud Job Orchestrator — Demo UI</h1>
      <h3 id="subtitle">Bentornato:</h3>
      <p>
        Minimal static frontend for the walking skeleton. It creates a job,
        polls status, and retrieves the download link when the output is ready.
      </p>

      <div class="row">
        <div class="field">
          <label for="apiBase">API base URL</label>
          <input id="apiBase" type="text" value="http://localhost:7071/api" />
        </div>

        <div class="field">
          <label>User ID (from token)</label>
          <div id="pkDisplay" class="readonly-field">-</div>
        </div>
      </div>

      <div class="checkbox-row">
        <input id="forceFail" type="checkbox" />
        <label for="forceFail" style="margin: 0;">Force failure demo (parameters.fail=true)</label>
      </div>

      <div class="actions">
        <button id="createBtn">Create Job</button>
        <button id="refreshBtn" class="secondary" disabled>Refresh Status</button>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <div id="jobsContainer" class="container"></div>

      <template id="jobCardTemplate">
        <div class="card job-card">
          <h3>Job <span class="job-id"></span></h3>

          <div class="grid">
            <div class="stat">
              <div class="label">Status</div>
              <div class="value status"></div>
            </div>

            <div class="stat">
              <div class="label">Progress</div>
              <div class="value progress"></div>
            </div>
          </div>

          <div class="actions">
            <button class="downloadBtn" style="margin-bottom: 2%;"disabled>Download Output</button>
          </div>

          <pre class="logBox"></pre>
        </div>
      </template>

    </div>
  </div>
</body>
</html>
